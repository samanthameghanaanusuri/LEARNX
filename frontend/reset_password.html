<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARNX — Create New Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 450px;
            width: 90%;
            margin: 4rem auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand">⚡ LEARNX</a>
        </div>
    </nav>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="glass-card auth-container">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Create New Password</h2>
            
            <div id="status-alert" class="alert alert-danger" style="display: none;"></div>
            
            <div id="invalid-token-msg" style="display: none; text-align: center;">
                <p>The password reset link is invalid or has expired.</p>
                <a href="/forgot_password.html" class="btn btn-primary" style="margin-top: 1rem;">Request New Link</a>
            </div>

            <form id="reset-password-form" onsubmit="handleResetPasswordSubmit(event)" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="new_password">New Password</label>
                    <div class="password-container">
                        <input class="form-input" type="password" id="new_password" required placeholder="Enter new password" minlength="8">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('new_password', this)" tabindex="-1">
                            👁
                        </button>
                    </div>
                </div>
                
                <div class="form-group">
                    <label class="form-label" for="confirm_password">Confirm New Password</label>
                    <div class="password-container">
                        <input class="form-input" type="password" id="confirm_password" required placeholder="Confirm new password" minlength="8">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm_password', this)" tabindex="-1">
                            👁
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary" type="submit" id="submit-btn" style="width: 100%; margin-top: 1rem;">Reset Password</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 LEARNX Engine.</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/reset_password.js"></script>
</body>
</html>
