<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Detail - LEARNX</title>
    <link rel="stylesheet" href="/css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        .course-header-banner {
            text-align: center;
            padding: 2rem;
            margin-bottom: 2rem;
        }
        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: rgba(255,255,255,0.1);
            border-radius: 4px;
            margin: 1rem 0;
            overflow: hidden;
        }
        .progress-bar {
            height: 100%;
            background: var(--accent);
            width: 0%;
            transition: width 0.3s ease;
        }
        .module-accordion {
            margin-bottom: 1rem;
        }
        .module-header {
            padding: 1rem;
            cursor: pointer;
            background: rgba(255,255,255,0.05);
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .module-header:hover {
            background: rgba(255,255,255,0.08);
        }
        .lesson-list {
            padding: 1rem;
            display: none;
        }
        .lesson-list.active {
            display: block;
        }
        .lesson-item {
            display: flex;
            justify-content: space-between;
            padding: 0.8rem;
            border-bottom: 1px solid rgba(255,255,255,0.1);
            cursor: pointer;
            align-items: center;
        }
        .lesson-item:hover {
            background: rgba(255,255,255,0.03);
        }
        .status-icon {
            font-size: 1.2rem;
        }
        .status-completed { color: #4caf50; }
        .status-not_started { color: rgba(255,255,255,0.3); }
        .enroll-btn {
            padding: 1rem 2rem;
            font-size: 1.1rem;
            margin-top: 1rem;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <nav class="sidebar">
            <div class="logo">
                <h1>LEARN<span>X</span></h1>
            </div>
            <ul class="nav-links">
                <li><a href="/dashboard.html">Dashboard</a></li>
                <li class="active"><a href="/courses.html">Courses</a></li>
            </ul>
        </nav>

        <main class="main-content">
            <div class="glass-panel course-header-banner" id="course-header">
                <div class="loading">Loading course...</div>
            </div>

            <div class="content-area">
                <div id="enrollment-section" style="display:none; text-align:center; margin-bottom: 2rem;">
                    <button class="btn btn-primary enroll-btn" id="btn-enroll">Enroll in Course</button>
                </div>
                
                <div id="modules-container">
                    <!-- Modules load here -->
                </div>
            </div>
        </main>
    </div>

    <script src="/js/api.js"></script>
    <script src="/js/course.js"></script>
</body>
</html>
