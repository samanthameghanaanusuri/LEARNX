<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARNX — Student Authentication</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 450px;
            width: 90%;
            margin: 4rem auto;
        }
        .auth-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-card);
            margin-bottom: 2rem;
        }
        .auth-tab {
            flex: 1;
            padding: 1rem;
            text-align: center;
            font-weight: 700;
            cursor: pointer;
            color: var(--text-secondary);
            border-bottom: 2px solid transparent;
            transition: all 0.2s ease;
        }
        .auth-tab.active {
            color: var(--text-primary);
            border-color: var(--color-primary);
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand">⚡ LEARNX</a>
        </div>
    </nav>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="glass-card auth-container">
            <div class="auth-tabs">
                <div class="auth-tab active" id="tab-login" onclick="switchTab('login')">Sign In</div>
                <div class="auth-tab" id="tab-register" onclick="switchTab('register')">Create Account</div>
            </div>

            <div id="error-alert" class="alert alert-danger" style="display: none;"></div>

            <form id="auth-form" onsubmit="handleAuthSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="username">Username</label>
                    <input class="form-input" type="text" id="username" required placeholder="Enter username">
                </div>

                <div class="form-group" id="email-group" style="display: none;">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-input" type="email" id="email" placeholder="Enter email">
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Password</label>
                    <div class="password-container">
                        <input class="form-input" type="password" id="password" required placeholder="Enter password" minlength="8">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('password', this)" tabindex="-1">
                            👁
                        </button>
                    </div>
                    <a href="/forgot_password.html" class="forgot-link" id="forgot-password-link">Forgot Password?</a>
                </div>

                <div class="form-group" id="confirm-password-group" style="display: none;">
                    <label class="form-label" for="confirm_password">Confirm Password</label>
                    <div class="password-container">
                        <input class="form-input" type="password" id="confirm_password" placeholder="Confirm password" minlength="8">
                        <button type="button" class="toggle-password" onclick="togglePasswordVisibility('confirm_password', this)" tabindex="-1">
                            👁
                        </button>
                    </div>
                </div>

                <button class="btn btn-primary" type="submit" id="submit-btn" style="width: 100%; margin-top: 1rem;">Sign In</button>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 LEARNX Engine.</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/auth.js"></script>
</body>
</html>
