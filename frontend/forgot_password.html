<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEARNX — Forgot Password</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            max-width: 450px;
            width: 90%;
            margin: 4rem auto;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="container">
            <a href="/" class="nav-brand">⚡ LEARNX</a>
        </div>
    </nav>

    <main class="container" style="flex: 1; display: flex; align-items: center; justify-content: center;">
        <div class="glass-card auth-container">
            <h2 style="text-align: center; margin-bottom: 1.5rem;">Reset Password</h2>
            <p style="text-align: center; margin-bottom: 2rem;">Enter your registered email address to receive a password reset link.</p>

            <div id="status-alert" class="alert alert-info" style="display: none;"></div>

            <form id="forgot-password-form" onsubmit="handleForgotPasswordSubmit(event)">
                <div class="form-group">
                    <label class="form-label" for="email">Email Address</label>
                    <input class="form-input" type="email" id="email" required placeholder="Enter email">
                </div>

                <button class="btn btn-primary" type="submit" id="submit-btn" style="width: 100%; margin-top: 1rem;">Send Reset Link</button>
                
                <div style="text-align: center; margin-top: 1.5rem;">
                    <a href="/auth.html" class="forgot-link">Back to Sign In</a>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 LEARNX Engine.</p>
        </div>
    </footer>

    <script src="/js/api.js"></script>
    <script src="/js/forgot_password.js"></script>
</body>
</html>
